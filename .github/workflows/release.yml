name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Check tag matches package version
        shell: bash
        run: node scripts/verify-release.mjs --tag="$GITHUB_REF_NAME"

      - name: Run tests
        run: npm test

      - name: Validate champion item guides
        run: npm run validate:items

      - name: Build Windows artifacts
        run: npm run build:win

      - name: Verify installer and updater metadata
        shell: bash
        run: node scripts/verify-release.mjs --windows --tag="$GITHUB_REF_NAME"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "App-LOL $TAG" --generate-notes
          gh release upload "$TAG" \
            release/App-LOL-Setup-x64.exe \
            release/App-LOL-Setup-x64.exe.blockmap \
            release/App-LOL-Portable-x64.exe \
            release/latest.yml \
            --clobber
          gh release edit "$TAG" --draft=false
